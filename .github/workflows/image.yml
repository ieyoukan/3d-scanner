# コンテナイメージをビルドし、GHCR（GitHub Container Registry）に公開する。
#
#   main への push   → ビルドして ghcr.io/<owner>/3d-scanner に push（latest と sha-<コミット> のタグ）
#   Pull Request     → ビルドだけ（Dockerfile が壊れていないかの確認。push はしない）
#   手動実行         → Actions の画面から実行できる
#
# 初回は COLMAP と OpenSplat のコンパイルに 40〜60 分かかる。2回目以降は、
# 変わっていない層をキャッシュ（GitHub Actions のキャッシュ）から再利用するので短くなる。
name: Image

on:
  push:
    branches: [main]
    # イメージの中身に関係するファイルが変わったときだけ走らせる（文書だけの変更では走らない）。
    paths:
      - deploy/docker/**
      - server/**
      - web/**
      - .dockerignore
      - .github/workflows/image.yml
  pull_request:
    paths:
      - deploy/docker/**
      - .dockerignore
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  # GHCR へ push するための権限。このワークフローにだけ与える。
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ビルド（linux/amd64）
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR にログイン
        # Pull Request では push しないのでログインも不要（fork からの PR に権限を渡さない）。
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN は実行のたびに GitHub が発行する一時的なトークン。自分で秘密を登録する必要が無い。
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: タグとラベルを決める
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # main の最新。手軽だが「どの版か」が曖昧なので、固定したいときは sha- のタグを使う。
            type=raw,value=latest,enable={{is_default_branch}}
            # コミットごとに一意なタグ。Helm の image.tag にこれを指定すると、配備する版を固定できる。
            type=sha,prefix=sha-,format=short
            # v1.2.3 のようなタグを打ったときは、その番号でも公開する。
            type=semver,pattern={{version}}

      - name: ビルドして push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          # 配備先のクラスタは amd64（Proxmox 上の VM）。
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=max: 最終イメージに含まれない途中の層（COLMAP のビルド結果など）もキャッシュする。
          cache-from: type=gha
          cache-to: type=gha,mode=max
