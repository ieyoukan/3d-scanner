# コンテナイメージをビルドし、GHCR（GitHub Container Registry）に公開する。役割ごとに 3 つのイメージがある:
#
#   ghcr.io/<owner>/3d-scanner-web     画面（nginx）
#   ghcr.io/<owner>/3d-scanner-api     API（Go、distroless）
#   ghcr.io/<owner>/3d-scanner-worker  ワーカー（Go と COLMAP・OpenMVS・OpenSplat 等）
#
#   main への push   → 中身が変わったイメージだけをビルドして push（latest と sha-<コミット> のタグ）
#   Pull Request     → 3 つともビルドだけ（Dockerfile が壊れていないかの確認。push はしない）
#   手動実行         → 3 つともビルドして push
#
# なぜ「変わったものだけ」なのか: 本番は Argo CD Image Updater がイメージごとに最新の sha- タグへ更新する。
# 中身が同じでもタグが新しくなれば Pod が入れ替わるので、画面だけ直したときに worker まで入れ替わり、
# 処理中の 3D 生成が止まってしまう。
#
# worker の初回は COLMAP・OpenMVS・OpenSplat のコンパイルに 1 時間以上かかる。2 回目以降は、変わっていない層を
# キャッシュ（GitHub Actions のキャッシュ）から再利用するので短くなる。
name: Image

on:
  push:
    branches: [main]
    paths:
      - deploy/docker/**
      - server/**
      - web/**
      - .dockerignore
      - .github/workflows/image.yml
  pull_request:
    paths:
      - deploy/docker/**
      - .dockerignore
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  # GHCR へ push するための権限。このワークフローにだけ与える。
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ビルド ${{ matrix.target }}（linux/amd64）
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # paths: このイメージの中身に関わるファイル（grep -E の正規表現）。
          - target: web
            paths: '^(web/|deploy/docker/(Dockerfile|nginx\.conf)$|\.dockerignore$)'
          - target: api
            paths: '^(server/|deploy/docker/Dockerfile$|\.dockerignore$)'
          - target: worker
            paths: '^(server/|deploy/docker/Dockerfile$|\.dockerignore$)'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push の前後のコミットを比べるため、少し深く取る。
          fetch-depth: 50

      - name: このイメージに関わる変更があるか
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          PATHS: ${{ matrix.paths }}
        run: |
          # push 以外（PR・手動）と、ワークフロー自体を変えたときは、必ずビルドする。
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          if echo "$files" | grep -qE "$PATHS|^\.github/workflows/image\.yml$"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.target }} に関わる変更が無いので、ビルドしません。"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changed.outputs.build == 'true'

      - name: GHCR にログイン
        # Pull Request では push しないのでログインも不要（fork からの PR に権限を渡さない）。
        if: steps.changed.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN は実行のたびに GitHub が発行する一時的なトークン。自分で秘密を登録する必要が無い。
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: タグとラベルを決める
        if: steps.changed.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # コミットごとに一意なタグ。Helm の <役割>.image.tag にこれを指定すると、配備する版を固定できる。
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: ビルドして push
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          # 配備先のクラスタは amd64（Proxmox 上の VM）。
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=max: 最終イメージに含まれない途中の層（COLMAP のビルド結果など）もキャッシュする。
          # scope を役割ごとに分け、互いのキャッシュを上書きしないようにする。
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
