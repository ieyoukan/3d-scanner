# 画面（Vite でビルドした静的ファイル）を配る nginx の設定。web イメージに入れる。
#
# /api/ は API の Pod が受け持つ（Ingress で振り分ける）。ここに来るのは画面のファイルだけ。
#   /assets/*   ファイル名に内容のハッシュが付いているので、1 年キャッシュしてよい（immutable）
#   それ以外    ファイルが無ければ index.html を返す（React Router の画面遷移。/scans/xxx を直接開いても動く）
#               index.html は毎回確かめさせる（no-cache）。新しい版を配ったらすぐ切り替わるように
# セキュリティ用のヘッダは、Go の API が付けているもの（server/internal/httpapi/server.go の securityHeaders）と同じ。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # 圧縮（JS・CSS・JSON・SVG）。画像と WebAssembly 以外のテキストを小さくする。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location ^~ /assets/ {
        # add_header は location で書くと外側のものを引き継がないので、もう一度書く。
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # index.html は毎回確かめさせる。/ や /scans/... から内部で index.html に回ってきたときもここに来る
    # （完全一致の location は、下の拡張子の正規表現より優先される）。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # 拡張子のあるパス（.js・.png など）で無いものは 404（index.html を返すと、壊れたスクリプトとして読まれる）。
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }

    # 追加の設定（docker compose では /api を api のコンテナへ転送する設定を差し込む。Kubernetes では Ingress が振り分けるので空）。
    include /etc/nginx/extra/*.conf;

    # Kubernetes の生存確認用（ファイルを読まずに 200 を返す）。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
