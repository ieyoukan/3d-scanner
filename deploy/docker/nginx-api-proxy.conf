# docker compose 用: /api を api のコンテナへ転送する（Kubernetes では Ingress が振り分けるので使わない）。
# web イメージの /etc/nginx/extra/ に差し込む（docker-compose.yml の web の volumes）。
# ^~: 拡張子の正規表現（.glb・.json などを静的ファイルとして探す規則）より、この前方一致を優先する。
location ^~ /api/ {
    proxy_pass http://api:8080;
    # ポート番号も含めて渡す（API は Origin とホストを比べて、別サイトからの操作を断るため）。
    proxy_set_header Host $http_host;
    # 写真のアップロード（1 回 最大 95MB）を、ためずにそのまま流す。
    client_max_body_size 100m;
    proxy_request_buffering off;
    # 位置合わせは最大 80 秒ほどかかる。
    proxy_read_timeout 120s;
}
