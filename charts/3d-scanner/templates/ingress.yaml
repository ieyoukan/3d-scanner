{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "3d-scanner.fullname" . }}
  labels:
    {{- include "3d-scanner.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /*
          paths を省略したホストは「/ 以下すべて」とみなす。
          helm の --set 'ingress.hosts[0].host=...' はリストを丸ごと置き換えるので、
          既定値の paths が消える。そのままだと経路の無い不正な Ingress になってしまう。
          */}}
          {{- range (.paths | default (list (dict "path" "/" "pathType" "Prefix"))) }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "3d-scanner.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
