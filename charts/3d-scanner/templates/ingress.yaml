{{- if .Values.ingress.enabled }}
{{- /*
外部公開。/api/ は api の Pod、それ以外（画面）は web の Pod に振り分ける。
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "3d-scanner.fullname" . }}
  labels:
    {{- include "3d-scanner.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "3d-scanner.componentName" (list $ "api") }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "3d-scanner.componentName" (list $ "web") }}
                port:
                  name: http
    {{- end }}
{{- end }}
