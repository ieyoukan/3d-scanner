{{- include "3d-scanner.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "3d-scanner.fullname" . }}
  labels:
    {{- include "3d-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  # レプリカは 1 に固定（values で変えられないようにしてある）。理由:
  #  - 作業領域の PVC は ReadWriteOnce。2 つ目の Pod が別ノードに載るとマウントできない。
  #  - ワーカーは起動時に「running のまま残ったジョブ」を前回の自分の残骸として回復する。
  #    Pod が複数あると、他の Pod が実行中のジョブまで巻き戻してしまう。
  replicas: 1
  # Recreate: 新しい Pod を作る前に古い Pod を止める。
  # 既定の RollingUpdate は新旧を一時的に同時に動かすので、上の「1 つだけ」が崩れる。
  # 更新中は数十秒つながらなくなるが、MVP では整合性を優先する。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "3d-scanner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "3d-scanner.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations:
        # ConfigMap の中身のハッシュ。設定を変えるとこの値が変わり、Pod が作り直される。
        # （環境変数は Pod の起動時にしか読まれないので、ConfigMap だけ変えても反映されないため）
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # このアプリは Kubernetes の API を呼ばないので、トークンをコンテナに入れない。
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "3d-scanner.fullname" . }}
          env:
            # 秘密の値は Secret から直接読む（ConfigMap や values に平文で置かない）。
            {{- if not .Values.auth.allowNoAuth }}
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "3d-scanner.auth.secretName" . }}
                  key: {{ .Values.auth.existingSecretKey }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "3d-scanner.database.secretName" . }}
                  key: {{ include "3d-scanner.database.secretKey" . }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # 3 種類のヘルスチェック:
          #  startupProbe   起動が終わるまで待つ。成功するまで他の 2 つは始まらない。
          #                 DB の準備を待つことがあるので、最大 5 秒 × 30 回 = 150 秒の猶予を与える。
          #  livenessProbe  プロセスが生きているか。失敗が続くとコンテナを再起動する。
          #                 /healthz は DB を見ない: DB の一時的な障害でアプリまで再起動されると、
          #                 実行中の復元ジョブが無駄に中断されるため。
          #  readinessProbe リクエストを受けられるか。失敗中は Service の転送先から外れる（再起動はしない）。
          #                 /readyz は DB と作業領域を確認する。
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- with .Values.resources.requests }}
            requests:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            limits:
              {{- with .Values.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
              {{- if .Values.gpu.enabled }}
              # GPU はデバイスプラグインが公開する「拡張リソース」として要求する。
              # 整数単位でしか割り当てられず、limits に書く。
              {{ .Values.gpu.resourceName }}: {{ .Values.gpu.count | quote }}
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            # ルートファイルシステムは読み取り専用なので、一時ファイル用の書ける場所を用意する。
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "3d-scanner.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
