apiVersion: v1
kind: Service
metadata:
  name: {{ include "3d-scanner.fullname" . }}
  labels:
    {{- include "3d-scanner.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # コンテナ側のポートは番号ではなく名前（http）で指す。Deployment 側で番号を変えても追従する。
      targetPort: http
      protocol: TCP
  selector:
    {{- include "3d-scanner.selectorLabels" . | nindent 4 }}
