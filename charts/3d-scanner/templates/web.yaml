{{- include "3d-scanner.validate" . -}}
{{- /*
web: 画面（静的ファイル）を nginx で配る。状態を持たないので、止めずに入れ替える（RollingUpdate）。
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "3d-scanner.componentName" (list . "web") }}
  labels:
    {{- include "3d-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 新しい Pod が準備できてから古い Pod を止める（入れ替え中も画面が開ける）。
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "3d-scanner.componentSelector" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "3d-scanner.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "3d-scanner.image" (list . "web") | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            # nginx は一時ファイルと PID を /tmp に書く（ルートファイルシステムは読み取り専用）。
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "3d-scanner.componentName" (list . "web") }}
  labels:
    {{- include "3d-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "3d-scanner.componentSelector" (list . "web") | nindent 4 }}
