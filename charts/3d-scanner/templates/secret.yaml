{{- /*
values で秘密の値が直接渡されたときだけ Secret を作る（手元での検証用）。
本番では postgresql.auth.existingSecret を指定し、
SealedSecret などで別途作った Secret を参照する。その場合、このファイルは何も出力しない。
*/ -}}
{{- include "3d-scanner.validate" . -}}
{{- if include "3d-scanner.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "3d-scanner.secretName" . }}
  labels:
    {{- include "3d-scanner.labels" . | nindent 4 }}
type: Opaque
# stringData は平文で書ける入力専用の欄。Kubernetes が保存時に base64 へ変換する。
stringData:
  {{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) .Values.postgresql.auth.password }}
  {{ .Values.postgresql.auth.existingSecretKey }}: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}
{{- end }}
