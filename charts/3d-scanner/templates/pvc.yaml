{{- /*
作業領域（/data）の PersistentVolumeClaim。
写真・中間ファイル・成果物を置く。Pod が再起動しても消えない。
*/ -}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "3d-scanner.fullname" . }}-data
  labels:
    {{- include "3d-scanner.labels" . | nindent 4 }}
spec:
  accessModes:
    # ReadWriteOnce: 同時に 1 つのノードからだけ読み書きできる。
    # Proxmox CSI のボリュームは VM に接続する仮想ディスクなので、この指定になる。
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
